<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daniel Martin — Multipotentialite</title>
    <meta name="description" content="A personal portfolio of writing, web design, software projects, and work history." />
    <meta property="og:title" content="Daniel Martin — Multipotentialite" />
    <meta property="og:description" content="Work, writing, projects, and everything in between." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='23' fill='white'%3ERP%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="brand" href="#top" aria-label="Back to top">
            <span class="brand-mark" aria-hidden="true">DM</span>
            <span id="brand-name">Daniel Martin</span>
          </a>
          <nav class="main-nav" aria-label="Primary navigation">
            <a href="#work" data-nav="work">Work</a>
            <a href="#projects" data-nav="projects">Projects</a>
            <a href="#about" data-nav="about">About</a>
            <a href="#timeline" data-nav="timeline">Timeline</a>
            <a href="#contact" data-nav="contact">Contact</a>
          </nav>
          <div class="header-tools">
            <button class="quiet-control theme-control" id="theme-toggle" type="button" aria-label="Use dark theme">◐</button>
          </div>
        </div>
      </header>

      <main id="top">
        <section class="hero section container" aria-labelledby="hero-heading">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-heading"></h1>
          <p class="hero-copy" id="hero-supporting"></p>
          <div class="hero-bottom">
            <p class="current-note" id="hero-current"></p>
            <a class="text-link" href="#work"><span id="hero-scroll"></span> <span aria-hidden="true">↓</span></a>
          </div>
        </section>

        <section class="section container" id="work" aria-labelledby="work-heading">
          <div class="section-intro">
            <p class="eyebrow" id="work-label"></p>
            <h2 id="work-heading"></h2>
          </div>
          <div class="work-list" id="work-list"></div>
        </section>

        <section class="section section-muted" id="projects" aria-labelledby="projects-heading">
          <div class="container project-layout">
            <div class="section-intro">
              <p class="eyebrow" id="projects-label"></p>
              <h2 id="projects-heading"></h2>
              <p id="projects-intro"></p>
            </div>
            <div class="project-list" id="project-list"></div>
          </div>
          <div class="container currently" aria-label="Currently">
            <p class="eyebrow" id="currently-label"></p>
            <div class="currently-list" id="currently-list"></div>
          </div>
        </section>

        <section class="section container" id="about" aria-labelledby="about-heading">
          <div class="two-column">
            <div class="section-intro">
              <p class="eyebrow" id="about-label"></p>
              <h2 id="about-heading"></h2>
            </div>
            <div>
              <p class="large-copy" id="about-copy"></p>
              <div class="areas">
                <p class="eyebrow" id="areas-title"></p>
                <div class="area-list" id="area-list"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="section section-muted" id="timeline" aria-labelledby="timeline-heading">
          <div class="container two-column">
            <div class="section-intro">
              <p class="eyebrow" id="timeline-label"></p>
              <h2 id="timeline-heading"></h2>
              <p id="timeline-copy"></p>
              <a class="text-link" id="timeline-link" target="_blank" rel="noreferrer"></a>
            </div>
            <div class="timeline-list" id="timeline-list"></div>
          </div>
        </section>

        <section class="section contact-section" id="contact" aria-labelledby="contact-heading">
          <div class="container two-column">
            <div class="section-intro">
              <p class="eyebrow" id="contact-label"></p>
              <h2 id="contact-heading"></h2>
            </div>
            <div>
              <p class="large-copy" id="contact-copy"></p>
              <div class="contact-list" id="contact-list"></div>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <span><span id="footer-name"></span> · <span id="footer-year"></span></span>
          <div class="footer-links">
            <a id="footer-email"></a>
            <a id="footer-instagram" target="_blank" rel="noreferrer">Instagram</a>
            <a id="footer-whatsapp" target="_blank" rel="noreferrer">WhatsApp</a>
            <span id="footer-signoff"></span>
          </div>
        </div>
      </footer>
    </div>
    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
